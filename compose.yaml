services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - ./redis_data:/data
    networks:
      - state_network

  sequence-state-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8079:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiPrefix=dev
      - RedisServer=redis:6379
      - RedisPassword=eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    depends_on:
      - redis
    networks:
      - state_network

networks:
  state_network:
    driver: bridge
